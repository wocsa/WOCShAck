{% extends 'base/base.html' %}
{% block title %}Edit Webhook - V.R.C{% endblock %}

{% block extra_css %}
<style>
    .dev-container { max-width: 700px; margin: 0 auto; padding: var(--vrc-spacing-xl); }
    .form-card { background: var(--vrc-white); border-radius: var(--vrc-radius-lg); padding: var(--vrc-spacing-xl); box-shadow: var(--vrc-shadow-md); }
    .form-card h1 { font-size: var(--vrc-font-size-2xl); font-weight: var(--vrc-font-weight-bold); margin-bottom: var(--vrc-spacing-lg); }
    .form-group { margin-bottom: var(--vrc-spacing-lg); }
    .form-group label { display: block; font-size: var(--vrc-font-size-sm); font-weight: var(--vrc-font-weight-medium); color: var(--vrc-gray-700); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1px solid var(--vrc-gray-300); border-radius: var(--vrc-radius-md); font-size: var(--vrc-font-size-base); box-sizing: border-box; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: var(--vrc-font-size-sm); }
    .toggle-label { display: flex; align-items: center; gap: 8px; font-size: var(--vrc-font-size-sm); color: var(--vrc-gray-700); }
    .btn-primary { padding: 10px 24px; background: var(--vrc-gradient); color: white; border: none; border-radius: var(--vrc-radius-md); cursor: pointer; }
    .back-link { display: inline-block; margin-bottom: var(--vrc-spacing-lg); color: var(--vrc-primary); text-decoration: none; font-size: var(--vrc-font-size-sm); }
</style>
{% endblock %}

{% block content %}
<div class="dev-container">
    <a href="{% url 'developer_webhooks' %}" class="back-link">&larr; Back to Webhooks</a>
    <div class="form-card">
        <h1>Edit Webhook</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="url">Endpoint URL</label>
                <input type="url" id="url" name="url" value="{{ webhook.url }}" required>
            </div>
            <div class="form-group">
                <label>Events</label>
                <div class="checkbox-grid">
                    {% for event in event_choices %}
                    <label class="checkbox-label"><input type="checkbox" name="events" value="{{ event }}" {% if event in webhook.events %}checked{% endif %}> {{ event }}</label>
                    {% endfor %}
                </div>
            </div>
            <div class="form-group">
                <label class="toggle-label"><input type="checkbox" name="is_active" {% if webhook.is_active %}checked{% endif %}> Active</label>
            </div>
            <button type="submit" class="btn-primary">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
