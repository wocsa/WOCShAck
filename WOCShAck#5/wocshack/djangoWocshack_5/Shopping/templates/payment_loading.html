{% extends "payment.html" %}
{% load static %}
{% block title %}
V.R.C - Payment
{% endblock %}

{% block loader %}
<link rel="stylesheet" href="{% static 'css/payment_loading.css' %}">
<div class="loader_div">
  <span class="loader"></span>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // Authentication already completed on payment form
  // No popup needed - directly process payment
  window.addEventListener('load', function () {
    // Automatically submit payment after a short delay
    setTimeout(function() {
      completePayment();
    }, 1000);
  });

  function completePayment() {
    // Get CSRF token from cookie
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    // Submit POST request to complete the order
    fetch('/shop/payment/complete/', {
      method: 'POST',
      headers: {
        'X-CSRFToken': csrftoken,
        'Content-Type': 'application/json',
      },
      credentials: 'same-origin'
    })
    .then(response => {
      if (response.redirected) {
        window.location.href = response.url;
      } else {
        return response.json();
      }
    })
    .then(data => {
      if (data && data.error) {
        alert('Payment failed: ' + data.error);
        window.location.href = '/shop/cart/';
      }
    })
    .catch(error => {
      console.error('Error:', error);
      alert('An error occurred during payment processing.');
      window.location.href = '/shop/cart/';
    });
  }
</script>
{% endblock extra_js %}
