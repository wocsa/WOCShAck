x-bw-env: &bw-env
  API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
  DATABASE_URI: "mariadb+pymysql://bunkerweb:changeme@bw-db:3306/db"
  SERVER_NAMES_HASH_BUCKET_SIZE: "512"
  # Adjust security headers for reverse proxy configuration.
  REMOVE_HEADERS: "X-Frame-Options Content-Security-Policy Content-Security-Policy-Report-Only X-XSS-Protection X-Content-Type-Options Referrer-Policy Permissions-Policy"

services:
  # Banking backend API — exposes internal port 7051 as 8001 on host
  vrc_banking_backend:
    build: ./VRC_Banking_System_Backend
    container_name: vrc_banking_backend
    ports:
      - "8001:7051"
    volumes:
      - ./VRC_Banking_System_Backend/Utils:/app/Utils
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/172.28.0.2/7051' 2>/dev/null && echo ok" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      wocshack_net:
        ipv4_address: 172.28.0.2

  # Webmail server — accessible on host port 8088 (8080 may conflict with Burp Suite)
  webmail:
    build: ./tools/Webmail
    container_name: webmail
    ports:
      - "8088:80"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost/api/health', timeout=3)\"" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      wocshack_net:
        ipv4_address: 172.28.0.4
      bw-services:

        # Ollama LLM service — serves gemma3:1b for the chatbot RAG pipeline
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "ollama serve & sleep 5 && ollama pull gemma3:1b && wait" ]
    networks:
      wocshack_net:
        ipv4_address: 172.28.0.5

  # Moderation auto-approve bot — polls the REST API to approve pending queue items
  moderation_bot:
    build: ./moderation_bot
    container_name: moderation_bot
    restart: unless-stopped
    environment:
      - DJANGO_BASE_URL=http://172.28.0.3:8000
      - POLL_INTERVAL=120
    depends_on:
      django_wocshack:
        condition: service_started
    networks:
      wocshack_net:
        ipv4_address: 172.28.0.6

  # Main Django application — depends on banking backend and webmail being healthy
  # Each source folder is bind-mounted individually for live code reloading.
  # db.sqlite3 and media/ are intentionally excluded: they are committed to git
  # and baked into the image, so the container always starts from a clean state.
  django_wocshack:
    build: ./djangoWocshack_5
    container_name: django_wocshack
    ports:
      - "8000:8000"
      #volumes:
      #- ./djangoWocshack_5/Account:/app/Account
      #- ./djangoWocshack_5/Advertisement:/app/Advertisement
      #- ./djangoWocshack_5/Api:/app/Api
      #- ./djangoWocshack_5/Bank:/app/Bank
      #- ./djangoWocshack_5/Chatbot:/app/Chatbot
      #- ./djangoWocshack_5/Community:/app/Community
      #- ./djangoWocshack_5/Developer:/app/Developer
      #- ./djangoWocshack_5/Forum:/app/Forum
      #- ./djangoWocshack_5/Moderation:/app/Moderation
      #- ./djangoWocshack_5/Shopping:/app/Shopping
      #- ./djangoWocshack_5/Todo:/app/Todo
      #- ./djangoWocshack_5/css_files:/app/css_files
      #- ./djangoWocshack_5/djangoWocshack_5:/app/djangoWocshack_5
      #- ./djangoWocshack_5/setup:/app/setup
      #- ./djangoWocshack_5/shared:/app/shared
      #- ./djangoWocshack_5/manage.py:/app/manage.py
      #- ./djangoWocshack_5/requirements.txt:/app/requirements.txt
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=djangoWocshack_5.settings.production
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma3:1b
    command: >
      bash -c "python manage.py migrate --noinput;
               python setup/setup_webmail.py || true;
               python setup/setup_banking.py || true;
               python manage.py runserver --insecure 0.0.0.0:8000"
    depends_on:
      vrc_banking_backend:
        condition: service_healthy
      webmail:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      wocshack_net:
        ipv4_address: 172.28.0.3
      bw-services:

  bunkerweb:
    image: bunkerity/bunkerweb:1.6.10-rc6
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp"
    environment:
      <<: *bw-env
    restart: unless-stopped
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.10-rc6
    environment:
      <<: *bw-env
      UI_HOST: "http://bw-ui:7000"
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "bunkerui.domain.com webmail.domain.com domain.com"
      # --- Disable WAF/anti-abuse plugins for application passthrough ---
      USE_BAD_BEHAVIOR: "no"
      SECURITY_MODE: "detect"
      USE_BLACKLIST: "no"          # default UA/IP blacklist (incl. python-requests)
      USE_WHITELIST: "no"
      USE_GREYLIST: "no"
      USE_DNSBL: "no"
      USE_ANTIBOT: "no"
      USE_REVERSE_SCAN: "no"
      USE_LIMIT_REQ: "no"          # no per-IP rate limiting
      USE_LIMIT_CONN: "no"
      # CSP/XSS/clickjacking headers off (also stripped via REMOVE_HEADERS above)
      CONTENT_SECURITY_POLICY: ""
      CONTENT_SECURITY_POLICY_REPORT_ONLY: ""
      X_FRAME_OPTIONS: ""
      X_CONTENT_TYPE_OPTIONS: ""
      X_XSS_PROTECTION: ""
      REFERRER_POLICY: ""
      PERMISSIONS_POLICY: ""
      FEATURE_POLICY: ""
      STRICT_TRANSPORT_SECURITY: ""
      COOKIE_FLAGS: ""             # don't auto-add Secure/HttpOnly/SameSite
      COOKIE_AUTO_SECURE_FLAG: "no"
      MULTISITE: "yes"
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
      ALLOWED_METHODS: "GET|POST|HEAD|OPTIONS|PUT|PATCH|DELETE"
      INTERCEPTED_ERROR_CODES: ""
      SERVE_FILES: "no"
      DISABLE_DEFAULT_SERVER: "no"
      AUTO_LETS_ENCRYPT: "no"
      USE_CLIENT_CACHE: "yes"
      USE_GZIP: "yes"
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://django_wocshack:8000"
      domain.com_REVERSE_PROXY_URL: "/"
      domain.com_REVERSE_PROXY_HOST: "http://django_wocshack:8000"
      webmail.domain.com_REVERSE_PROXY_URL: "/"
      webmail.domain.com_REVERSE_PROXY_HOST: "http://webmail"
      bunkerui.domain.com_REVERSE_PROXY_URL: "/"
      bunkerui.domain.com_REVERSE_PROXY_HOST: "http://bw-ui:7000"
    restart: unless-stopped
    depends_on:
      bw-db:
        condition: service_started
    networks:
      - bw-universe
      - bw-db

  bw-ui:
    image: bunkerity/bunkerweb-ui:1.6.10-rc6
    environment:
      <<: *bw-env
      ADMIN_USERNAME: "wocsa_admin"
      ADMIN_PASSWORD: "Wocsa_password123!"
    restart: unless-stopped
    networks:
      - bw-universe
      - bw-db

  bw-db:
    image: mariadb:11
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "db"
      MYSQL_USER: "bunkerweb"
      MYSQL_PASSWORD: "changeme"
    volumes:
      - bw-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - bw-db

# Shared bridge network with fixed subnet for static IPs
networks:
  wocshack_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  bw-universe:
    name: bw-universe
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
  bw-db:
    name: bw-db

volumes:
  ollama_data:
  bw-data:
