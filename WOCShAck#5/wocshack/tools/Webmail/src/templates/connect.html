<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackBox: Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='connection_pages_style.css') }}">
</head>

<body>
    {% include "components/navbar.html" %}
    <div class="header-container">
        <h1>TrackBox</h1>
        <p>Welcome back to the panopticon.</p>
    </div>
    <div class="form-container">
        <form action="/connect" method="POST">
            <h2>Connect</h2>

            {% block error %}
            {% if error_message %}
            <div class="alert text-white mb-4" role="alert">
                {{ error_message|escape }}
            </div>
            {% endif %}
            {% endblock %}

            <div class="mb-3 text-start">
                <label for="Ufield">Username</label>
                <input type="text" id="Ufield" name="Ufield" placeholder="username@tbox.traced" required>
            </div>

            <div class="mb-4 text-start">
                <label for="Pfield">Password</label>
                <input type="password" id="Pfield" name="Pfield" placeholder="Enter your secret" required>
            </div>

            <button type="submit">Establish Connection</button>

            <div class="auth-links">
                <a href="/signup">Not being tracked yet? Sign up here.</a>
            </div>
        </form>
    </div>
</body>

</html>
