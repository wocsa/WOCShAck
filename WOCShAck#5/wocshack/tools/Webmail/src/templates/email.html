<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackBox: Email View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_client.css') }}">
</head>

<body>
    <!-- Header -->
    {% include "components/navbar.html" %}

    <div class="container mt-5" style="flex: 1">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card p-5 mb-5 shadow-lg position-relative overflow-hidden" style="border-radius: 16px;">
                    <div class="position-absolute top-0 end-0 p-3 opacity-25"
                        style="font-size: 5rem; line-height: 1; pointer-events: none; z-index: 0;">👁️</div>
                    <div style="position: relative; z-index: 1;">
                        <div class="d-flex align-items-center mb-4">
                            <div class="text-white d-flex justify-content-center align-items-center rounded-circle me-3"
                                style="width: 50px; height: 50px; font-size: 1.5rem; background: linear-gradient(135deg, #58a6ff, #3b82f6); box-shadow: 0 4px 10px rgba(88, 166, 255, 0.3);">
                                {{ email[1][0] | upper }}
                            </div>
                            <div>
                                <h5 class="mb-1" style="color: #e6edf3;"><strong>From:</strong> <span
                                        style="color: #58a6ff;">{{ email[1] }}</span></h5>
                                <h6 class="mb-0 text-secondary"><strong>Subject:</strong> <span
                                        style="color: #c9d1d9;">{{ email[3] }}</span></h6>
                            </div>
                        </div>
                        <hr class="my-4">
                        <div class="email-body p-4 rounded"
                            style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);">
                            <p class="whitespace-pre-wrap m-0"
                                style="color: #e6edf3; font-size: 1.1rem; line-height: 1.6;">{{ email[4] | safe }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3">
        <p class="mb-0 small" style="color: #8b949e;">TrackBox &copy; 2024 - We See Everything</p>
    </footer>

    <style>
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2) !important;
            transform: translateY(-2px);
        }
    </style>
</body>

</html>
