<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackBox: Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='connection_pages_style.css') }}">
</head>

<body>
    {% include "components/navbar.html" %}
    <div class="header-container">
        <h1>TrackBox</h1>
        <p>Join the ecosystem that knows you better than yourself.</p>
    </div>
    <div class="form-container">
        <form action="/signup" method="POST">
            <h2>Sign Up</h2>

            {% block error %}
            {% endblock %}

            <div class="mb-3 text-start">
                <label for="Ufield">Username</label>
                <input type="text" id="Ufield" name="Ufield" placeholder="username" required>
            </div>

            <div class="mb-3 text-start">
                <label for="Pfield">Password</label>
                <input type="password" id="Pfield" name="Pfield" placeholder="Make it memorable" required>
            </div>

            <div class="mb-4 text-start">
                <label for="CPfield">Confirm Password</label>
                <input type="password" id="CPfield" name="CPfield" placeholder="Type it again, we're watching" required>
            </div>

            <button type="submit">Begin Tracking</button>

            <div class="auth-links">
                <a href="/connect">Already surveilled? Connect here.</a>
            </div>
        </form>
    </div>
</body>

</html>
